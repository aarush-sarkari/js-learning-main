<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding elements into the DOM</title>
</head>
<body style = "background-color: #212121; color:white;">
<ul class = "language">
    <li>html</li>
    
</ul>
<script>
    function addLanguage(language){
        const li = document.createElement('li');
    li.innerHTML = `${language}`;
    document.querySelector('.language')
    .appendChild(li);
    }
    addLanguage('aarush')
    addLanguage('sarkari')

    function addLanguage2(lang){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(lang));
        document.querySelector('.language').appendChild(li);
    }
    addLanguage2('python')

    // edit 
    const changelanguage = document.querySelector('li:nth-child(2)')
    const newli = document.createElement('li')
    newli.textContent = "javascript"
    changelanguage.replaceWith(newli);

    const newlang = document.querySelector('li:nth-child(3)')
    const newli2 = document.createElement('li')
    newli2.textContent = "java"
    newlang.replaceWith(newli2);

    // remove 
    const lastlang = document.querySelector('li:nth-child(4)')
    lastlang.remove();
</script>
    
    
</body>
</html>
